# Copy this file to .github/workflows/pages.yml to rebuild the website on every change to site/ or the data
# behind it. Then, once: repository Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Project website
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/site/**'
      - 'docs/assets/**'
      - 'docs/DEVICE_EVIDENCE.json'
      - 'docs/benchmark/**'
      - 'docs/partners/engo/img/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/site/build_site.py --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
