name: Verify device workspace
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest moved to 26.04, which has no Python 3.14.4 build yet.
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - name: Hardware partners log (ENGO, ActiveLook by Microoled, Heltec Automation, Elecrow, AirGradient)
        run: python -c "import json; ps=json.load(open('docs/partners/partners.json',encoding='utf8'))['partners']; print('OpenBridge hardware partners:', ', '.join(p['name'] for p in ps)); [print(' -', p['name'], p['url']) for p in ps]"
      - name: Hardware partners commitments check (ENGO, ActiveLook by Microoled, Heltec Automation, Elecrow, AirGradient)
        run: python -m unittest -v tests.unit.test_partner_commitments
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
  bench:
    # Micro-benchmarks with absolute ceilings (dependency-free); fails on gross regressions only.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - run: python scripts/verify/bench.py
  engo-emulator:
    # HUD renderer tests need Pillow (optional); the dependency-free job above skips them.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - run: python -m pip install "$(grep -i '^pillow==' requirements-optional.txt)"
      - run: >-
          python -m unittest -v
          tests.unit.test_activelook tests.unit.test_engo_killer_features tests.unit.test_engo_ai_bridge
          tests.unit.test_engo_openbridge_neural_integration tests.unit.test_hud_studio
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - run: python -m pip install -r requirements-dev.txt
      - name: Use primary Ubuntu package mirror
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
          fi
      - run: python -m playwright install --with-deps chromium
      - run: python -m tests.e2e.command_center_smoke
      - run: python -m tests.e2e.route_inspector_smoke
      - run: python -m tests.e2e.control_consent_smoke
      - run: python -m tests.e2e.agent_portal_smoke
      - run: python -m tests.e2e.offline_smoke
      - run: python -m tests.e2e.guided_smoke
      - run: python -m tests.e2e.fabric_smoke
      - run: python -m tests.e2e.ui_v2_smoke
      - run: python -m tests.e2e.integrate_page_smoke
  browser-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - run: python -m pip install -r requirements-dev.txt
      # NOTE: no --with-deps and no apt step: both are Linux-only.
      - run: python -m playwright install chromium webkit
      - run: python -m tests.e2e.command_center_smoke
      - run: python -m tests.e2e.route_inspector_smoke
      - run: python -m tests.e2e.control_consent_smoke
      - run: python -m tests.e2e.agent_portal_smoke
      - run: python -m tests.e2e.offline_smoke
      - run: python -m tests.e2e.guided_smoke
      - run: python -m tests.e2e.fabric_smoke
      - run: python -m tests.e2e.ui_v2_smoke
      - run: python -m tests.e2e.integrate_page_smoke
      - run: python -m tests.e2e.offline_smoke
        env:
          OB_PLAYWRIGHT_ENGINE: webkit
