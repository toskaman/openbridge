name: Verify device workspace
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - run: python -m pip install -r requirements-dev.txt
      - name: Use primary Ubuntu package mirror
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
          fi
      - run: python -m playwright install --with-deps chromium
      - run: python -m tests.e2e.offline_smoke
      - run: python -m tests.e2e.guided_smoke
      - run: python -m tests.e2e.fabric_smoke
