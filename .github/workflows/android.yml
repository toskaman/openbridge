name: Android emulator lab
# §7: build the REAL Companion APK (no-Gradle SDK script), boot official
# emulators, install, launch, screenshot, logcat. Manual dispatch only.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          test -x "$SDK/cmdline-tools/16.0/bin/sdkmanager" || test -d "$SDK/cmdline-tools/latest" || { echo "no preinstalled SDK"; exit 1; }
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          for d in "$SDK/cmdline-tools/16.0/bin" "$SDK/cmdline-tools/latest/bin"; do
            if [ -x "$d/sdkmanager" ]; then echo "$d" >> $GITHUB_PATH; break; fi
          done
          echo "$SDK/platform-tools" >> $GITHUB_PATH
      - run: yes | sdkmanager --licenses > /dev/null
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: python -m dev.build_companion
      - run: sha256sum artifacts/companion/openbridge-companion.apk | tee artifacts/companion/apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: companion-apk
          path: artifacts/companion/
          retention-days: 21
  phone:
    needs: build-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: companion-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          test -x "$SDK/cmdline-tools/16.0/bin/sdkmanager" || test -d "$SDK/cmdline-tools/latest" || { echo "no preinstalled SDK"; exit 1; }
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          for d in "$SDK/cmdline-tools/16.0/bin" "$SDK/cmdline-tools/latest/bin"; do
            if [ -x "$d/sdkmanager" ]; then echo "$d" >> $GITHUB_PATH; break; fi
          done
          echo "$SDK/platform-tools" >> $GITHUB_PATH
      - name: Phone acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          script: |
            set -e
            dump_diag() {
              echo "=== phone failure diagnostics ==="
              {
                echo "--- adb devices ---"
                adb devices -l || echo "ADB_DEVICES_FAILED"
                echo "--- sys.boot_completed ---"
                adb shell getprop sys.boot_completed || echo "GETPROP_FAILED"
                echo "--- pid ---"
                adb shell pidof fr.openbridge.companion || echo "NO_PID"
                echo "--- foreground probe ---"
                cat phone-foreground.txt 2>/dev/null || echo "NO_FOREGROUND_FILE"
              } | tee phone-diag.txt
              if ! adb shell getprop sys.boot_completed 2>/dev/null | grep -q 1; then
                echo "VERDICT=EMULATOR_DEAD_OR_UNRESPONSIVE" | tee -a phone-diag.txt
              elif ! test -s phone-pid.txt; then
                echo "VERDICT=APP_CRASH_OR_NOT_RUNNING" | tee -a phone-diag.txt
              else
                echo "VERDICT=APP_ALIVE_NOT_FOREGROUND" | tee -a phone-diag.txt
              fi
              adb logcat -d > phone-logcat.txt || true
              adb shell dumpsys activity activities > phone-activities.txt || true
              timeout 120 adb bugreport phone-bugreport.zip || echo "BUGREPORT_FAILED" > phone-bugreport-failed.txt
              ls -la *.txt *.zip || true
            }
            timeout 120 adb wait-for-device
            adb install --no-incremental apk/openbridge-companion.apk
            adb shell pm grant fr.openbridge.companion android.permission.BLUETOOTH_SCAN || true
            adb shell pm grant fr.openbridge.companion android.permission.BLUETOOTH_CONNECT || true
            adb shell pm grant fr.openbridge.companion android.permission.RECORD_AUDIO || true
            adb shell am start -n fr.openbridge.companion/.MainActivity
            timeout 60 adb wait-for-device
            ok=0
            for i in 1 2 3 4 5 6; do
              sleep 5
              adb shell pidof fr.openbridge.companion | tee phone-pid.txt || true
              adb shell dumpsys activity activities | grep -m1 -i openbridge | tee phone-foreground.txt || true
              if test -s phone-pid.txt && test -s phone-foreground.txt; then ok=1; break; fi
              echo "attempt $i/6: pid/foreground not ready, retrying"
            done
            if test "$ok" != 1; then
              echo "PHONE acceptance FAILED after 6 attempts (bounded ~30s)"
              dump_diag
              exit 1
            fi
            adb shell dumpsys package fr.openbridge.companion | grep -m1 versionName | tee phone-version.txt
            adb logcat -d -t 300 > phone-logcat.txt
            ls -la *.png *.mp4 *.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-phone-evidence
          path: |
            phone-pid.txt
            phone-foreground.txt
            phone-version.txt
            phone-logcat.txt
            phone-activities.txt
            phone-diag.txt
            phone-bugreport.zip
            phone-bugreport-failed.txt
          retention-days: 21
          if-no-files-found: warn
  tv:
    needs: build-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: companion-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          test -x "$SDK/cmdline-tools/16.0/bin/sdkmanager" || test -d "$SDK/cmdline-tools/latest" || { echo "no preinstalled SDK"; exit 1; }
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          for d in "$SDK/cmdline-tools/16.0/bin" "$SDK/cmdline-tools/latest/bin"; do
            if [ -x "$d/sdkmanager" ]; then echo "$d" >> $GITHUB_PATH; break; fi
          done
          echo "$SDK/platform-tools" >> $GITHUB_PATH
      - name: TV acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-tv
          arch: x86
          profile: tv_1080p
          emulator-boot-timeout: 600
          script: |
            set -e
            adb install --no-incremental apk/openbridge-companion.apk
            adb shell pm grant fr.openbridge.companion android.permission.BLUETOOTH_SCAN || true
            adb shell pm grant fr.openbridge.companion android.permission.BLUETOOTH_CONNECT || true
            adb shell pm grant fr.openbridge.companion android.permission.RECORD_AUDIO || true
            adb shell am start -n fr.openbridge.companion/.MainActivity
            sleep 10
            adb shell screencap -p /sdcard/tv-launch.png && adb pull /sdcard/tv-launch.png
            adb shell input keyevent KEYCODE_DPAD_DOWN || true
            sleep 2
            adb shell screencap -p /sdcard/tv-focus.png && adb pull /sdcard/tv-focus.png
            adb logcat -d -t 300 > tv-logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-tv-evidence
          path: |
            tv-launch.png
            tv-focus.png
            tv-logcat.txt
          retention-days: 21
          if-no-files-found: warn
  wear:
    needs: build-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: companion-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          test -x "$SDK/cmdline-tools/16.0/bin/sdkmanager" || test -d "$SDK/cmdline-tools/latest" || { echo "no preinstalled SDK"; exit 1; }
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          for d in "$SDK/cmdline-tools/16.0/bin" "$SDK/cmdline-tools/latest/bin"; do
            if [ -x "$d/sdkmanager" ]; then echo "$d" >> $GITHUB_PATH; break; fi
          done
          echo "$SDK/platform-tools" >> $GITHUB_PATH
      - name: Wear acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-wear
          arch: x86_64
          profile: wearos_large_round
          emulator-boot-timeout: 600
          script: |
            set -e
            adb install --no-incremental apk/openbridge-companion.apk
            adb shell pm grant fr.openbridge.companion android.permission.BLUETOOTH_SCAN || true
            adb shell pm grant fr.openbridge.companion android.permission.BLUETOOTH_CONNECT || true
            adb shell pm grant fr.openbridge.companion android.permission.RECORD_AUDIO || true
            adb shell am start -n fr.openbridge.companion/.MainActivity
            sleep 10
            adb exec-out screencap -p > wear-launch.png
            adb logcat -d -t 300 > wear-logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-wear-evidence
          path: |
            wear-launch.png
            wear-logcat.txt
          retention-days: 21
          if-no-files-found: warn

  e2e:
    needs: build-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - uses: actions/download-artifact@v4
        with:
          name: companion-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          test -x "$SDK/cmdline-tools/16.0/bin/sdkmanager" || test -d "$SDK/cmdline-tools/latest" || { echo "no preinstalled SDK"; exit 1; }
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          for d in "$SDK/cmdline-tools/16.0/bin" "$SDK/cmdline-tools/latest/bin"; do
            if [ -x "$d/sdkmanager" ]; then echo "$d" >> $GITHUB_PATH; break; fi
          done
          echo "$SDK/platform-tools" >> $GITHUB_PATH
      - name: Cloud end-to-end
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-tv
          arch: x86
          profile: tv_1080p
          emulator-boot-timeout: 600
          script: |
            set -e
            python scripts/verify/cloud_e2e.py --apk apk/openbridge-companion.apk --out e2e-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-e2e-evidence
          path: e2e-evidence
          retention-days: 21
          if-no-files-found: warn
