name: Android emulator lab
# §7: build the REAL Companion APK (no-Gradle SDK script), boot official
# emulators, install, launch, screenshot, logcat. Manual dispatch only.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          test -x "$SDK/cmdline-tools/16.0/bin/sdkmanager" || test -d "$SDK/cmdline-tools/latest" || { echo "no preinstalled SDK"; exit 1; }
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          for d in "$SDK/cmdline-tools/16.0/bin" "$SDK/cmdline-tools/latest/bin"; do
            if [ -x "$d/sdkmanager" ]; then echo "$d" >> $GITHUB_PATH; break; fi
          done
          echo "$SDK/platform-tools" >> $GITHUB_PATH
      - run: yes | sdkmanager --licenses > /dev/null
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: python -m dev.build_companion
      - run: sha256sum artifacts/companion/openbridge-companion.apk | tee artifacts/companion/apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: companion-apk
          path: artifacts/companion/
          retention-days: 21
  phone:
    needs: build-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: companion-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          test -x "$SDK/cmdline-tools/16.0/bin/sdkmanager" || test -d "$SDK/cmdline-tools/latest" || { echo "no preinstalled SDK"; exit 1; }
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          for d in "$SDK/cmdline-tools/16.0/bin" "$SDK/cmdline-tools/latest/bin"; do
            if [ -x "$d/sdkmanager" ]; then echo "$d" >> $GITHUB_PATH; break; fi
          done
          echo "$SDK/platform-tools" >> $GITHUB_PATH
      - name: Phone acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          script: |
            EMU_DEVICE=phone EMU_APK=apk/openbridge-companion.apk \
              bash "$GITHUB_WORKSPACE/scripts/verify/emu_harness.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-phone-evidence
          path: |
            phone-verdict.txt
            phone-verdict.json
            phone-pid.txt
            phone-foreground.txt
            phone-version.txt
            phone-install.txt
            phone-start.txt
            phone-logcat.txt
            phone-activities.txt
            phone-diag.txt
            phone-bugreport.zip
            phone-bugreport-failed.txt
          retention-days: 21
          if-no-files-found: warn
  tv:
    needs: build-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: companion-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          test -x "$SDK/cmdline-tools/16.0/bin/sdkmanager" || test -d "$SDK/cmdline-tools/latest" || { echo "no preinstalled SDK"; exit 1; }
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          for d in "$SDK/cmdline-tools/16.0/bin" "$SDK/cmdline-tools/latest/bin"; do
            if [ -x "$d/sdkmanager" ]; then echo "$d" >> $GITHUB_PATH; break; fi
          done
          echo "$SDK/platform-tools" >> $GITHUB_PATH
      - name: TV acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-tv
          arch: x86
          profile: tv_1080p
          emulator-boot-timeout: 600
          script: |
            set -e
            adb install --no-incremental apk/openbridge-companion.apk
            adb shell pm grant fr.openbridge.companion android.permission.BLUETOOTH_SCAN || true
            adb shell pm grant fr.openbridge.companion android.permission.BLUETOOTH_CONNECT || true
            adb shell pm grant fr.openbridge.companion android.permission.RECORD_AUDIO || true
            adb shell am start -n fr.openbridge.companion/.MainActivity
            sleep 10
            adb shell screencap -p /sdcard/tv-launch.png && adb pull /sdcard/tv-launch.png
            adb shell input keyevent KEYCODE_DPAD_DOWN || true
            sleep 2
            adb shell screencap -p /sdcard/tv-focus.png && adb pull /sdcard/tv-focus.png
            adb logcat -d -t 300 > tv-logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-tv-evidence
          path: |
            tv-launch.png
            tv-focus.png
            tv-logcat.txt
          retention-days: 21
          if-no-files-found: warn
  wear:
    needs: build-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: companion-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          test -x "$SDK/cmdline-tools/16.0/bin/sdkmanager" || test -d "$SDK/cmdline-tools/latest" || { echo "no preinstalled SDK"; exit 1; }
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          for d in "$SDK/cmdline-tools/16.0/bin" "$SDK/cmdline-tools/latest/bin"; do
            if [ -x "$d/sdkmanager" ]; then echo "$d" >> $GITHUB_PATH; break; fi
          done
          echo "$SDK/platform-tools" >> $GITHUB_PATH
      - name: Wear acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-wear
          arch: x86_64
          profile: wearos_large_round
          emulator-boot-timeout: 600
          script: |
            EMU_DEVICE=wear EMU_APK=apk/openbridge-companion.apk \
              bash "$GITHUB_WORKSPACE/scripts/verify/emu_harness.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-wear-evidence
          path: |
            wear-verdict.txt
            wear-verdict.json
            wear-pid.txt
            wear-foreground.txt
            wear-version.txt
            wear-install.txt
            wear-start.txt
            wear-launch.png
            wear-logcat.txt
            wear-activities.txt
            wear-diag.txt
            wear-bugreport.zip
            wear-bugreport-failed.txt
          retention-days: 21
          if-no-files-found: warn

  e2e:
    needs: build-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - uses: actions/download-artifact@v4
        with:
          name: companion-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          test -x "$SDK/cmdline-tools/16.0/bin/sdkmanager" || test -d "$SDK/cmdline-tools/latest" || { echo "no preinstalled SDK"; exit 1; }
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          for d in "$SDK/cmdline-tools/16.0/bin" "$SDK/cmdline-tools/latest/bin"; do
            if [ -x "$d/sdkmanager" ]; then echo "$d" >> $GITHUB_PATH; break; fi
          done
          echo "$SDK/platform-tools" >> $GITHUB_PATH
      - name: Cloud end-to-end
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-tv
          arch: x86
          profile: tv_1080p
          emulator-boot-timeout: 600
          script: |
            set -e
            python scripts/verify/cloud_e2e.py --apk apk/openbridge-companion.apk --out e2e-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-e2e-evidence
          path: e2e-evidence
          retention-days: 21
          if-no-files-found: warn
