# Builds the ready-to-run Windows download for each published release, checks that it runs,
# attests where it came from (Sigstore build provenance) and what it contains (CycloneDX SBOM, also attested),
# and attaches both to the release.
name: Windows download
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the download to'
        required: true
permissions:
  contents: read
jobs:
  bundle:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - name: Build and smoke-test the bundle
        run: python scripts/release/build_windows_bundle.py --out dist/OpenBridge-Windows-x64.zip --smoke
      - name: Software bill of materials (CycloneDX)
        run: python scripts/release/sbom.py --version "$($env:TAG.TrimStart('v'))" --bundle dist/OpenBridge-Windows-x64.zip --out dist/OpenBridge-Windows-x64.cdx.json
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/OpenBridge-Windows-x64.zip
      - uses: actions/attest-sbom@v2
        with:
          subject-path: dist/OpenBridge-Windows-x64.zip
          sbom-path: dist/OpenBridge-Windows-x64.cdx.json
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:TAG" dist/OpenBridge-Windows-x64.zip dist/OpenBridge-Windows-x64.zip.sha256 dist/OpenBridge-Windows-x64.cdx.json --clobber
