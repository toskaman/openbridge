<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 150" width="1280" height="150" role="img" aria-label="OpenBridge in numbers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a0f24"/>
      <stop offset="1" stop-color="#140d2b"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf3e1"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <style>
      .v{font:800 44px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:url(#num)}
      .l{font:500 15px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#a9b8dc}
      .sep{stroke:#ffffff;stroke-opacity:.08}
    </style>
  </defs>
  <rect width="1280" height="150" rx="18" fill="url(#bg)"/>
  <g text-anchor="middle">
    <text x="128" y="78" class="v">2,400+</text><text x="128" y="108" class="l">automated tests</text>
    <line x1="256" y1="30" x2="256" y2="120" class="sep"/>
    <text x="384" y="78" class="v">37</text><text x="384" y="108" class="l">verified device runs</text>
    <line x1="512" y1="30" x2="512" y2="120" class="sep"/>
    <text x="640" y="78" class="v">28</text><text x="640" y="108" class="l">on real hardware</text>
    <line x1="768" y1="30" x2="768" y2="120" class="sep"/>
    <text x="896" y="78" class="v">6</text><text x="896" y="108" class="l">platforms · 1 codebase</text>
    <line x1="1024" y1="30" x2="1024" y2="120" class="sep"/>
    <text x="1152" y="78" class="v">0</text><text x="1152" y="108" class="l">runtime dependencies</text>
  </g>
</svg>
