<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="How it works: discover, understand, create, check"><title>How it works: discover, understand, create, check</title><style>@font-face{font-family:ob-display;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:ob-body;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:ob-strong;src:url(data:font/woff2;base64,) format('woff2')}</style><rect width="1280" height="300" rx="16" fill="#0d1117"/><rect x="20" y="20" width="287" height="260" rx="14" fill="#151b23" stroke="#2a313c" stroke-width="1.5"/><text x="48" y="66" font-family="ob-display" font-size="22" fill="#2dd4bf" text-anchor="start">01</text><text x="48" y="112" font-family="ob-display" font-size="34" fill="#f0f3f6" text-anchor="start">Discover</text><text x="48" y="150" font-family="ob-body" font-size="17.5" fill="#9198a1" text-anchor="start">Finds the devices around you:</text><text x="48" y="176" font-family="ob-body" font-size="17.5" fill="#9198a1" text-anchor="start">Wi-Fi, Bluetooth, USB, your</text><text x="48" y="202" font-family="ob-body" font-size="17.5" fill="#9198a1" text-anchor="start">router, even other PCs.</text><line x1="48" y1="216" x2="279" y2="216" stroke="#2a313c" stroke-width="1.5"/><text x="48" y="252" font-family="ob-strong" font-size="16" fill="#2dd4bf" text-anchor="start">“24 devices found on my LAN”</text><rect x="330" y="20" width="287" height="260" rx="14" fill="#151b23" stroke="#2a313c" stroke-width="1.5"/><text x="358" y="66" font-family="ob-display" font-size="22" fill="#2dd4bf" text-anchor="start">02</text><text x="358" y="112" font-family="ob-display" font-size="34" fill="#f0f3f6" text-anchor="start">Understand</text><text x="358" y="150" font-family="ob-body" font-size="17.5" fill="#9198a1" text-anchor="start">Learns what each device can</text><text x="358" y="176" font-family="ob-body" font-size="17.5" fill="#9198a1" text-anchor="start">really do, and proves it</text><text x="358" y="202" font-family="ob-body" font-size="17.5" fill="#9198a1" text-anchor="start">before trusting it.</text><line x1="358" y1="216" x2="589" y2="216" stroke="#2a313c" stroke-width="1.5"/><text x="358" y="252" font-family="ob-strong" font-size="16" fill="#2dd4bf" text-anchor="start">“Vacuum: start, pause, dock”</text><rect x="640" y="20" width="287" height="260" rx="14" fill="#151b23" stroke="#2a313c" stroke-width="1.5"/><text x="668" y="66" font-family="ob-display" font-size="22" fill="#2dd4bf" text-anchor="start">03</text><text x="668" y="112" font-family="ob-display" font-size="34" fill="#f0f3f6" text-anchor="start">Create</text><text x="668" y="150" font-family="ob-body" font-size="17.5" fill="#9198a1" text-anchor="start">You ask in plain words. It</text><text x="668" y="176" font-family="ob-body" font-size="17.5" fill="#9198a1" text-anchor="start">builds the control you need,</text><text x="668" y="202" font-family="ob-body" font-size="17.5" fill="#9198a1" text-anchor="start">on the screen you pick.</text><line x1="668" y1="216" x2="899" y2="216" stroke="#2a313c" stroke-width="1.5"/><text x="668" y="252" font-family="ob-strong" font-size="16" fill="#2dd4bf" text-anchor="start">“Put vacuum buttons on my TV”</text><rect x="950" y="20" width="287" height="260" rx="14" fill="#151b23" stroke="#2a313c" stroke-width="1.5"/><text x="978" y="66" font-family="ob-display" font-size="22" fill="#2dd4bf" text-anchor="start">04</text><text x="978" y="112" font-family="ob-display" font-size="34" fill="#f0f3f6" text-anchor="start">Check</text><text x="978" y="150" font-family="ob-body" font-size="17.5" fill="#9198a1" text-anchor="start">You approve. It acts, then</text><text x="978" y="176" font-family="ob-body" font-size="17.5" fill="#9198a1" text-anchor="start">reads the device back to be</text><text x="978" y="202" font-family="ob-body" font-size="17.5" fill="#9198a1" text-anchor="start">sure it really happened.</text><line x1="978" y1="216" x2="1209" y2="216" stroke="#2a313c" stroke-width="1.5"/><text x="978" y="252" font-family="ob-strong" font-size="16" fill="#2dd4bf" text-anchor="start">“Done, verified on the device”</text></svg>
