<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 270" width="1280" height="270" role="img" aria-label="How a hardware partnership works: you send a device, I integrate and test it, you get an ecosystem"><title>How a hardware partnership works: you send a device, I integrate and test it, you get an ecosystem</title><style>@font-face{font-family:ob-display;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:ob-body;src:url(data:font/woff2;base64,) format('woff2')}</style><rect width="1280" height="270" rx="16" fill="#ffffff"/><rect x="20" y="20" width="386" height="230" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><circle cx="66" cy="68" r="22" fill="#0f766e"/><text x="66" y="76" font-family="ob-display" font-size="22" fill="#ffffff" text-anchor="middle">1</text><text x="48" y="140" font-family="ob-display" font-size="32" fill="#1f2328" text-anchor="start">You send a device</text><text x="48" y="178" font-family="ob-body" font-size="19" fill="#59636e" text-anchor="start">A unit to keep (donated or</text><text x="48" y="204" font-family="ob-body" font-size="19" fill="#59636e" text-anchor="start">permanent loan), your API or</text><text x="48" y="230" font-family="ob-body" font-size="19" fill="#59636e" text-anchor="start">SDK docs, a technical contact.</text><path d="M412 135 h27 m-8 -7 l8 7 l-8 7" fill="none" stroke="#59636e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="447" y="20" width="386" height="230" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><circle cx="493" cy="68" r="22" fill="#0f766e"/><text x="493" y="76" font-family="ob-display" font-size="22" fill="#ffffff" text-anchor="middle">2</text><text x="475" y="140" font-family="ob-display" font-size="32" fill="#1f2328" text-anchor="start">I integrate and test it</text><text x="475" y="178" font-family="ob-body" font-size="19" fill="#59636e" text-anchor="start">A native adapter, an emulator,</text><text x="475" y="204" font-family="ob-body" font-size="19" fill="#59636e" text-anchor="start">and a test suite run on the</text><text x="475" y="230" font-family="ob-body" font-size="19" fill="#59636e" text-anchor="start">real hardware at every release.</text><path d="M839 135 h27 m-8 -7 l8 7 l-8 7" fill="none" stroke="#59636e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="874" y="20" width="386" height="230" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><circle cx="920" cy="68" r="22" fill="#0f766e"/><text x="920" y="76" font-family="ob-display" font-size="22" fill="#ffffff" text-anchor="middle">3</text><text x="902" y="140" font-family="ob-display" font-size="32" fill="#1f2328" text-anchor="start">You get an ecosystem</text><text x="902" y="178" font-family="ob-body" font-size="19" fill="#59636e" text-anchor="start">Your device works with TVs,</text><text x="902" y="204" font-family="ob-body" font-size="19" fill="#59636e" text-anchor="start">watches, phones and PCs, with</text><text x="902" y="230" font-family="ob-body" font-size="19" fill="#59636e" text-anchor="start">a public compatibility report.</text></svg>
