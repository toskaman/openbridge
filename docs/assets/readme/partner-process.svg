<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="How a partnership works: 1 you send hardware and docs, 2 we build an emulator and adapter, 3 we test and benchmark on the real device, 4 we publish a verified compatibility report and feature you as a partner." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset="0.6" stop-color="#0d1330"/>
      <stop offset="1" stop-color="#1a0f33"/>
    </linearGradient>
    <linearGradient id="rail" gradientUnits="userSpaceOnUse" x1="160" y1="0" x2="1120" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#7cf3e1"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </radialGradient>
    <style>
      .kick{font:700 13px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#7cf3e1;letter-spacing:.22em}
      .n{font:800 18px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#0a0f24}
      .t{font:700 18px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#ffffff}
      .w{font:700 12px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#a78bfa;letter-spacing:.12em}
      .b{font:400 14px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#a9b8dc}
      .flow{fill:none;stroke:url(#rail);stroke-width:3;stroke-dasharray:6 10;animation:f 1.8s linear infinite}
      @keyframes f{to{stroke-dashoffset:-32}}
    </style>
  </defs>
  <rect width="1280" height="300" rx="22" fill="url(#bg)"/>
  <text x="640" y="46" text-anchor="middle" class="kick">HOW A PARTNERSHIP WORKS</text>
  <line x1="160" y1="102" x2="1120" y2="102" stroke="#ffffff" stroke-opacity=".08" stroke-width="3"/>
  <line x1="160" y1="102" x2="1120" y2="102" class="flow"/>

  <g text-anchor="middle">
    <g transform="translate(160 0)">
      <circle cy="102" r="22" fill="url(#dot)"/><text y="108" class="n">1</text>
      <text y="158" class="w">DAY 0</text>
      <text y="184" class="t">You send a device</text>
      <text y="210" class="b">Hardware to keep (permanent),</text>
      <text y="230" class="b">API / SDK docs and a contact.</text>
    </g>
    <g transform="translate(480 0)">
      <circle cy="102" r="22" fill="url(#dot)"/><text y="108" class="n">2</text>
      <text y="158" class="w">FIRST WEEKS</text>
      <text y="184" class="t">Adapter and emulator</text>
      <text y="210" class="b">A native adapter, an emulator of</text>
      <text y="230" class="b">your device and first features.</text>
    </g>
    <g transform="translate(800 0)">
      <circle cy="102" r="22" fill="url(#dot)"/><text y="108" class="n">3</text>
      <text y="158" class="w">ON THE REAL DEVICE</text>
      <text y="184" class="t">Tests and benchmarks</text>
      <text y="210" class="b">Automated suites, read-back oracles</text>
      <text y="230" class="b">and benchmarks on your hardware.</text>
    </g>
    <g transform="translate(1120 0)">
      <circle cy="102" r="22" fill="url(#dot)"/><text y="108" class="n">4</text>
      <text y="158" class="w">PUBLIC</text>
      <text y="184" class="t">Verified report</text>
      <text y="210" class="b">A public compatibility report and</text>
      <text y="230" class="b">your brand featured as a partner.</text>
    </g>
  </g>
  <text x="640" y="276" text-anchor="middle" class="b" style="font-size:12.5px;fill:#7f8fb8">Everything simulated or emulated stays labelled as such; only real-device runs count as physical proof.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
